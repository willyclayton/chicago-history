name: Test and deploy to GitHub Pages

on:
  push:
    branches: [main, "claude/build-deploy-interactive-page-57c45d"]
  pull_request:
  workflow_dispatch:
  # Daily: archives sometimes rate-limit a run; the photo cache keeps what was fetched,
  # so each scheduled run adds photos that were missed before.
  schedule:
    - cron: "41 9 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

      # Photos: check licenses with Commons and the Library of Congress, download and
      # resize into public/media, write src/data/media.generated.json. The cache keeps
      # API answers and downloads between runs; the script never fails the build.
      - name: Restore photo cache
        id: media-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .media-cache
            public/media
          key: media-${{ hashFiles('src/data/media-manifest/**', 'scripts/media/**') }}-${{ github.run_id }}
          restore-keys: |
            media-${{ hashFiles('src/data/media-manifest/**', 'scripts/media/**') }}-
            media-
      - name: Build photos
        id: media
        timeout-minutes: 25
        run: node scripts/media/build-media.mjs
      - name: Save photo cache
        if: always() && steps.media.outputs.changed == 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .media-cache
            public/media
          key: media-${{ hashFiles('src/data/media-manifest/**', 'scripts/media/**') }}-${{ github.run_id }}
      - name: Upload photo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: media-report
          path: .media-cache/report.json
          if-no-files-found: ignore
          retention-days: 30

      - run: npm run build
        env:
          # Optional: add this repository secret to embed Street View in the story card.
          VITE_GOOGLE_MAPS_EMBED_KEY: ${{ secrets.VITE_GOOGLE_MAPS_EMBED_KEY }}
      - run: npx playwright install --with-deps chromium
      - run: npm run test:smoke
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: dist

  # Only main deploys: the github-pages environment rejects other branches.
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/configure-pages@v5
        continue-on-error: true
      - name: Pages is not switched on yet
        if: steps.pages.outcome == 'failure'
        run: |
          echo "::error title=Turn on GitHub Pages::Open https://github.com/${{ github.repository }}/settings/pages and set Build and deployment > Source to 'GitHub Actions', then re-run this workflow. (The workflow's token is not allowed to turn Pages on by itself.)"
          exit 1
      - id: deployment
        uses: actions/deploy-pages@v4
